name: Electron — Build & Release

# Triggers:
#   - Push to main OR any branch (so you can test CI on feature branches)
#   - Version tags vX.Y.Z  → builds + creates a GitHub Release
#   - Manual dispatch       → always builds, never publishes
on:
  push:
    branches: ['**']   # all branches, not just main
    tags:     ['v*']
  pull_request:        # also run on PRs so CI is visible before merge
  workflow_dispatch:

# Required for creating GitHub Releases and uploading release assets
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # ── 3. Install Electron dependencies ─────────────────────────────────────
      - name: Install dependencies
        working-directory: electron
        run: npm ci

      # ── 4a. Linux — extra deps for AppImage / rpm ─────────────────────────────
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot

      # ── 4b. macOS — import signing certificate (only when secret is set) ──────
      - name: Import macOS signing certificate
        if: matrix.platform == 'mac' && secrets.MAC_CSC_LINK != ''
        env:
          MAC_CSC_LINK:         ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          echo "$MAC_CSC_LINK" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain

      # ── 5. Build ──────────────────────────────────────────────────────────────
      #
      # Signing env vars are only passed when the corresponding secret exists.
      # electron-builder treats an empty/unset CSC_LINK as "no signing" and
      # proceeds with an unsigned build — which is fine for dev/CI testing.
      #
      # The critical fix for "Env WIN_CSC_LINK is not correct":
      #   Don't set WIN_CSC_LINK / CSC_LINK at all when the secrets are empty.
      #   We do this by using a conditional step approach: signing vars are set
      #   in a separate prepare step and exported to GITHUB_ENV only when
      #   the secret is non-empty.
      - name: Export signing env vars (skip if secrets absent)
        shell: bash
        env:
          _MAC_CSC_LINK:         ${{ secrets.MAC_CSC_LINK }}
          _MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          _WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          _WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          _APPLE_ID:             ${{ secrets.APPLE_ID }}
          _APPLE_APP_PW:         ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          _APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only forward a var when its secret is non-empty.
          # electron-builder must NOT see CSC_LINK / WIN_CSC_LINK set to ""
          # or a path — it will try to use them and fail.
          [[ -n "$_MAC_CSC_LINK" ]]         && echo "CSC_LINK=$_MAC_CSC_LINK"                         >> "$GITHUB_ENV" || true
          [[ -n "$_MAC_CSC_KEY_PASSWORD" ]] && echo "CSC_KEY_PASSWORD=$_MAC_CSC_KEY_PASSWORD"         >> "$GITHUB_ENV" || true
          [[ -n "$_WIN_CSC_LINK" ]]         && echo "WIN_CSC_LINK=$_WIN_CSC_LINK"                     >> "$GITHUB_ENV" || true
          [[ -n "$_WIN_CSC_KEY_PASSWORD" ]] && echo "WIN_CSC_KEY_PASSWORD=$_WIN_CSC_KEY_PASSWORD"     >> "$GITHUB_ENV" || true
          [[ -n "$_APPLE_ID" ]]             && echo "APPLE_ID=$_APPLE_ID"                             >> "$GITHUB_ENV" || true
          [[ -n "$_APPLE_APP_PW" ]]         && echo "APPLE_APP_SPECIFIC_PASSWORD=$_APPLE_APP_PW"      >> "$GITHUB_ENV" || true
          [[ -n "$_APPLE_TEAM_ID" ]]        && echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID"                   >> "$GITHUB_ENV" || true

      - name: Build — ${{ matrix.platform }}
        working-directory: electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            npx electron-builder --${{ matrix.platform }} --publish always
          else
            npx electron-builder --${{ matrix.platform }} --publish never
          fi

      # ── 6. Upload artifacts ───────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskboard-${{ matrix.platform }}
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe
            electron/dist/latest*.yml
          if-no-files-found: warn
          retention-days: 30

  # ── Summary ───────────────────────────────────────────────────────────────────
  release-summary:
    name: Release summary
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Done
        run: echo "All platform builds finished for ${{ github.ref_name }}"
