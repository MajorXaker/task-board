name: Docker — Build & Publish to GHCR

# Builds the Docker image and publishes it as a package to GitHub Container Registry:
#   ghcr.io/majorxaker/task-board
#
# Triggers:
#   - Push to main            → builds and pushes, tagged `latest` + commit SHA
#   - Version tag vX.Y.Z      → builds and pushes, tagged vX.Y.Z + vX.Y + `latest`
#   - Pull requests           → builds only (validates the Dockerfile, no publish)
#   - Manual dispatch         → builds and pushes
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # resolves to majorxaker/task-board (lowercase enforced below)

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Buildx (BuildKit, used for layer caching) ───────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to GHCR (skip on PRs, we only build there) ──────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Compute image tags & labels ──────────────────────────────────────────
      # Images must be lowercase for GHCR; docker/metadata-action handles that.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # branch name (e.g. main)
            type=ref,event=branch
            # vX.Y.Z tags → 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # short commit SHA
            type=sha,format=short
            # `latest` only from the default branch
            type=raw,value=latest,enable={{is_default_branch}}

      # ── 5. Build & push ────────────────────────────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache for Rust dependency layers (big speedup).
          cache-from: type=gha
          cache-to: type=gha,mode=max
