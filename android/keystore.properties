# Release signing properties.
#
# NOTE: this file, the keystore and the passwords are intentionally committed.
# The app is a LAN-only, sideloaded client with no secrets to protect; a
# committed, stable keystore means CI-built APKs can update over each other
# without requiring an uninstall first. Do NOT reuse this keystore for anything
# published to Play Store.
storeFile=keystore/release-signing.p12
storePassword=taskboard
keyAlias=taskboard
keyPassword=taskboard
